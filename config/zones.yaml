# Zones de danger, par scène (agent/src/alerts/zones.py). Une scène est
# reconnue par sa source (vidéo, ou image de fond d'une scène
# interactive) ; une source sans scène n'a aucune zone surveillée.
#
# Coordonnées normalisées (fraction de la largeur/hauteur, 0.0-1.0), pour
# rester valides quelle que soit la résolution. Chaque zone est un
# polygone simple, points dans l'ordre.
#
# Pour ajouter une scène : agent/src/alerts/define_zones.py (voir le
# README, « Ajouter une scène avec zones de danger »).

# Part minimale de la boîte qui doit recouvrir la zone pour compter comme
# une entrée, pour qu'un simple effleurement ne déclenche rien.
# Surchargeable par scène (clé min_coverage_fraction).
min_coverage_fraction: 0.2

scenes:
  chantier:
    source: "demo/assets/scenes/05_construction_site_access.jpg"
    zones:
      zone_centrale:
        - [0.116, 0.584]
        - [0.473, 0.463]
        - [0.863, 0.53]
        - [0.635, 0.854]
      zone_laterale:
        - [0.049, 0.61]
        - [0.366, 0.822]
        - [0.139, 0.996]
        - [0.002, 0.831]
        - [0.002, 0.631]
