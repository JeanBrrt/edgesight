# Réglages de l'agent conversationnel (agent/src/agent/)

llama_server_url: "http://127.0.0.1:8080/v1"

# Lancement de llama-server par 03_live_agent_demo.py
# (agent/src/agent/llm_server.py) : un serveur qui répond déjà est
# réutilisé, sinon il est lancé puis arrêté en fin de démo. Hôte et port
# viennent de llama_server_url, ne pas les répéter dans `args`. Avec
# `auto_start: false`, lancer le serveur à la main (README, section Démo).
llama_server:
  auto_start: true
  binary: "agent/third_party/llama.cpp/llama-server.exe"
  model: "agent/models/granite-4.1-3b-Q4_K_M.gguf"
  # Taille exacte du modèle, vérifiée par setup/check_demo.py pour repérer
  # un téléchargement tronqué. À mettre à jour en changeant de modèle.
  model_size_bytes: 2099501664
  # --jinja : requis pour les appels d'outils ; -ngl 99 : tout sur GPU ;
  # -c 8192 : taille du contexte.
  args: ["--jinja", "-ngl", "99", "-c", "8192"]
  # Chargement mesuré à ~4 s ; large marge pour un premier lancement.
  startup_timeout_seconds: 120
  # À consulter si le serveur ne démarre pas.
  log_path: "agent/data/llama-server.log"

system_prompt: >-
  Tu es un assistant qui répond à des questions sur des personnes et
  véhicules détectés par une caméra. Utilise toujours les tools
  disponibles pour obtenir des chiffres réels plutôt que d'inventer une
  réponse. Pour un outil qui prend un nom de zone, si la zone décrite par
  l'utilisateur ne correspond CLAIREMENT à aucune des zones connues,
  utilise la valeur 'zone_inconnue' -- ne choisis jamais la zone réelle la
  plus proche à sa place. Si une question fait suite à une précédente et
  semble incomplète (ex. "et les voitures ?" après une question sur les
  personnes), interprète-la dans le contexte de l'échange précédent. Un
  chiffre obtenu par un tool devient obsolète dès qu'il est donné :
  rappelle TOUJOURS le tool correspondant pour une question sur l'état
  actuel ("maintenant"), même si tu as déjà posé une question similaire
  plus tôt dans la conversation -- ne réutilise jamais un chiffre déjà
  donné pour répondre à une nouvelle question. Réponds ensuite de façon
  brève et naturelle en français.

# Allers-retours LLM <-> outils maximum par question.
max_rounds: 4

# Tokens générés maximum par requête. Sans plafond, un modèle qui boucle
# bloque l'assistant (vu sur "merci !" : 3 700 tokens, 90 s). Un appel
# d'outil et une réponse courte tiennent en moins de 200.
# Essayé sans succès : forcer un appel d'outil à chaque question
# (tool_choice="required") -- pas plus juste, et le modèle bouclait sur
# "merci" ou "bonjour" une fois sur trois.
max_tokens: 512

# Mémoire de la conversation, pour comprendre "et les voitures ?" après
# une question sur les personnes (rapport section 9.8). Les alertes n'en
# ont pas : elles restent hors de la conversation.
memory:
  enabled: true
  # Échanges gardés dans l'historique ; les plus anciens sont oubliés.
  max_turns: 6

# Délai sans détection pendant lequel un objet compte encore comme
# présent (outil count_now). Mesuré depuis l'envoi de la question, donc
# indépendant de la latence du LLM (rapport section 9.7). Un peu plus
# large que pour les alertes (1 s), qui doivent réagir vite.
freshness_seconds: 2.0
