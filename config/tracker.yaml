# Réglages du suivi multi-objets (agent/src/tracking/tracker.py). Valeurs
# justifiées dans le rapport, section 8.2.
#
# Les scores du modèle INT8 896px vont par paliers (..., 0,576, 0,658,
# 0,740, ...) : le seuil de création 0,65 revient à exiger 0,658.
# smoothing_alpha et max_cumulative_predicted_seconds sont propres au
# projet (absents de la librairie ByteTrack).

# FPS de référence du filtre de Kalman (défaut de la librairie). N'influe
# pas sur lost_track_buffer, compté en secondes réelles.
frame_rate: 30.0

# Passés tels quels à ByteTrackTracker (une instance par classe).
tracker_kwargs:
  # Score minimal pour créer une piste (défaut 0.7, abaissé pour les
  # scores plus modestes de ce modèle).
  track_activation_threshold: 0.65
  # Score au-dessus duquel une détection passe en 1re passe d'association
  # (défaut 0.6).
  high_conf_det_threshold: 0.35
  # Durée de survie d'une piste perdue, en "images à 30 FPS" : 90 = 3 s
  # réelles (défaut 30 = 1 s, trop court pour une occlusion brève).
  lost_track_buffer: 90
  # Mises à jour consécutives avant qu'une piste reçoive un identifiant et
  # soit affichée (défaut 2), pour ignorer les faux positifs isolés. Une
  # piste pas encore confirmée disparaît au premier raté. Mesuré sur les
  # vidéos de démo à ~18 FPS : 15 retardait l'affichage de 0,94 s en
  # médiane ; 5 le ramène à 0,39 s sans plus de faux positifs.
  minimum_consecutive_frames: 5
  # IoU minimal pour associer une détection à une piste (défaut).
  minimum_iou_threshold: 0.1

# Lissage exponentiel des boîtes affichées (poids de la nouvelle mesure).
# Relevé depuis 0.4 car la démo tourne bien sous 30 FPS.
smoothing_alpha: 0.55

# Hystérésis d'affichage : une piste apparaît au-dessus de hysteresis_high
# et ne disparaît que sous hysteresis_low, pour éviter le clignotement.
hysteresis_high: 0.4
hysteresis_low: 0.2

# Temps cumulé maximal qu'une piste peut passer en position seulement
# prédite (sans détection), remis à zéro par une détection solide. Évite
# qu'une piste fantôme réapparaisse indéfiniment.
max_cumulative_predicted_seconds: 3.0
