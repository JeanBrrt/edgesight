# Réglages communs aux 3 démos (lus par demo/src/common/config.py).

config_path: "detection/third_party/nanodet/config/nanodet-plus-m-1.5x_416-person-car.yml"

# Modèles disponibles. Chaque fichier ONNX est figé à la résolution de son
# export : input_size doit lui correspondre, quelle que soit la résolution
# de config_path (sinon les détections sont faussées sans erreur).
models:
  "896px":
    # mAP=0,462 sur test.json -- 26,9 FPS, meilleure précision du projet (rapport section 6)
    onnx_path: "detection/models/nanodet-plus-m-1.5x_896-person-car-int8-QDQ-u8s8.onnx"
    input_size: [896, 896]
  "512px":
    # mAP=0,400 -- 60,6 FPS, large marge sur le seuil de 25 FPS
    onnx_path: "detection/models/nanodet-plus-m-1.5x_512-person-car-int8-QDQ-u8s8.onnx"
    input_size: [512, 512]
  "416px":
    # mAP=0,348 -- premier modèle, le plus rapide (100 FPS)
    onnx_path: "detection/models/nanodet-plus-m-1.5x_416-person-car-int8-QDQ-u8s8.onnx"
    input_size: [416, 416]
active_model: "896px"

# Sources parcourues avec la touche 'c' (les vidéos bouclent). Vidéos
# Pixabay en plan fixe ; la dernière est la scène interactive du chantier.
demo_sources:
  - ["rue automnale - voiture", "demo/assets/scenes/01_autumn_street_car.mp4"]
  - ["autoroute - flux faible", "demo/assets/scenes/02_highway_low_traffic.mp4"]
  - ["autoroute - flux variable", "demo/assets/scenes/03_highway_long_traffic.mp4"]
  - ["pont pieton", "demo/assets/scenes/04_pedestrian_bridge.mp4"]
  - ["chantier interactif", "INTERACTIVE:demo/assets/scenes/05_construction_site_access.jpg|demo/assets/silhouettes/construction_worker.webp"]

# Toute vidéo (.mp4/.avi/.mov/.mkv/.webm) déposée ici s'ajoute au cycle,
# nommée d'après son fichier.
custom_videos_dir: "demo/assets/custom"

# Largeur max de la fenêtre vidéo, pour les sources plus grandes que
# l'écran.
display_max_width: 1280

# Classes ignorées juste après la détection (noms de cfg.class_names :
# "person", "car"). [] pour tout garder.
disabled_classes: []

# Seuil d'affichage de 01_detection_demo.py. Les deux autres démos filtrent
# via le tracker (hysteresis_high/low dans config/tracker.yaml).
raw_score_threshold: 0.5

# Inutilisé : les alertes de présence sont posées par l'agent.
person_alert_threshold_seconds: 10.0
