# nanodet-plus-m-1.5x_896 -- réentraînement identique à la génération 3
# originale (mêmes hyperparamètres exacts : batch=6, lr=2,625e-5,
# warmup=450, eta_min=1,3125e-6), avec le correctif de task.py
# (Val_loss_epoch, vraie moyenne sur tout le set de validation) appliqué
# -- même démarche que les réentraînements 416px et 512px
# (nanodet-plus-m-1.5x_{416,512}-person-car.yml). Troisième et dernière
# résolution à repasser sous ce correctif. Ce fichier a remplacé
# l'ancienne config pré-correctif (même nom, nettoyage 2026-09-29) ;
# l'ancien workspace pré-correctif avait déjà été supprimé la veille
# (nettoyage 2026-09-28, les chiffres de référence restent documentés
# section 4.3 du rapport).
save_dir: workspace/nanodet-plus-m-1.5x_896-person-car
model:
  weight_averager:
    name: ExpMovingAverager
    decay: 0.9998
  arch:
    name: NanoDetPlus
    detach_epoch: 10
    backbone:
      name: ShuffleNetV2
      model_size: 1.5x
      out_stages: [2, 3, 4]
      activation: LeakyReLU
    fpn:
      name: GhostPAN
      in_channels: [176, 352, 704]
      out_channels: 128
      kernel_size: 5
      num_extra_level: 1
      use_depthwise: True
      activation: LeakyReLU
    head:
      name: NanoDetPlusHead
      num_classes: 2
      input_channel: 128
      feat_channels: 128
      stacked_convs: 2
      kernel_size: 5
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
      norm_cfg:
        type: BN
      loss:
        loss_qfl:
          name: QualityFocalLoss
          use_sigmoid: True
          beta: 2.0
          loss_weight: 1.0
        loss_dfl:
          name: DistributionFocalLoss
          loss_weight: 0.25
        loss_bbox:
          name: GIoULoss
          loss_weight: 2.0
    # Auxiliary head, only use in training time.
    aux_head:
      name: SimpleConvHead
      num_classes: 2
      input_channel: 256
      feat_channels: 256
      stacked_convs: 4
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
data:
  train:
    name: CocoDataset
    img_path: detection/data/03_raw/train
    ann_path: detection/data/04_processed/train.json
    input_size: [896, 896] #[w,h]
    keep_ratio: False
    pipeline:
      perspective: 0.0
      scale: [0.6, 1.4]
      stretch: [[0.8, 1.2], [0.8, 1.2]]
      rotation: 0
      shear: 0
      translate: 0.2
      flip: 0.5
      brightness: 0.2
      contrast: [0.6, 1.4]
      saturation: [0.5, 1.2]
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]
  val:
    name: CocoDataset
    img_path: detection/data/03_raw/val
    ann_path: detection/data/04_processed/val.json
    input_size: [896, 896] #[w,h]
    keep_ratio: False
    pipeline:
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]
device:
  gpu_ids: [0]
  # Même précaution que la config originale : DataLoader recrée ses
  # workers à chaque epoch (Windows, spawn) -- 2 au lieu de 6 pour éviter
  # le MemoryError RAM système rencontré à cette résolution.
  workers_per_gpu: 2
  batchsize_per_gpu: 6
  precision: 16 # AMP training
schedule:
  # Reprise après interruption : décommenter la ligne ci-dessous (valeur
  # peu importe, seule la présence de la clé compte) puis relancer EXACTEMENT
  # la même commande. NanoDet sauvegarde déjà `model_last.ckpt` (poids +
  # optimiseur + position dans le cosine schedule + epoch courante) à la fin
  # de CHAQUE epoch (training_epoch_end, cf. nanodet/trainer/task.py) — la
  # reprise restaure tout cet état. Ne pas décommenter pour un premier
  # lancement : `model_last.ckpt` n'existe pas encore, `resume: true`
  # ferait planter le train.py sur un fichier introuvable.
  resume: true
  load_model: detection/models/pretrained/nanodet-plus-m-1.5x_416.pth
  optimizer:
    name: AdamW
    lr: 0.00002625
    weight_decay: 0.05
  warmup:
    name: linear
    steps: 450
    ratio: 0.0001
  total_epochs: 50
  lr_schedule:
    name: CosineAnnealingLR
    T_max: 50
    eta_min: 0.0000013125
  val_intervals: 4
grad_clip: 35
evaluator:
  name: CocoDetectionEvaluator
  save_key: mAP
log:
  interval: 20

class_names: ['person', 'car']
